# electron-builder 配置:产物输出到 release/(`npm run dist`)。
# 运行时依赖只有 node-pty(终端的 native 模块,postinstall 用 electron-rebuild
# 按 Electron ABI 重编)——其余 renderer 依赖仍由 electron-vite 打进 bundle,
# 除此例外外包内不携带其他 node_modules;userData/缓存都走 app.getPath('userData')。
appId: com.pion.app
productName: Pion
# 钉住代码身份,否则每次重打包本地网络等 TCC 授权都失效(见 afterPack.cjs)
afterPack: scripts/afterPack.cjs
directories:
  output: release
files:
  - out/**
  - assets/**
  - package.json
  # 终端的 native pty 模块(唯一运行时依赖,见文件头注释)
  - node_modules/node-pty/**
# .node 二进制不能被 asar 加载,必须解包
asarUnpack:
  - node_modules/node-pty/build/**
# kanban-bridge 扩展按 process.resourcesPath 定位(见 index.ts kanbanBridgePath),
# 必须落在 Pion.app/Contents/Resources/ 下,供 pi 子进程以普通文件读取
extraResources:
  - from: resources/kanban-bridge.ts
    to: kanban-bridge.ts
  - from: resources/pion-commands.ts
    to: pion-commands.ts
  # 单文件 daemon bundle:Settings 配对流程让用户把它拷到远程机器
  # (dev 态 main 会从 out/daemon/index.cjs 另存一份到 userData,二者内容一致)
  - from: out/daemon/index.cjs
    to: pion-daemon.cjs
npmRebuild: false
# 应用内升级(electron-updater):打包时据此生成 Resources/app-update.yml。
# 发版:npm version x.y.z && git push --follow-tags && GH_TOKEN=... npm run dist -- --publish always
publish:
  provider: github
  owner: zucchiniEvader
  repo: pion
mac:
  category: public.app-category.developer-tools
  icon: assets/pion-logo.png
  # 签名身份故意不写在这里(会带个人姓名/Team ID):本机证书在钥匙串时
  # electron-builder 自动发现,CI 走 CSC_LINK + CSC_KEY_PASSWORD。
  # 无凭据时跳过签名,afterPack 补 ad-hoc,本地构建不失败。
  # notarize 同理:环境变量缺失时自动跳过并打日志(见 CONTRIBUTING.md)。
  notarize: true
  target:
    - target: dmg
      arch: [arm64]
    # electron-updater 在 mac 上消费 zip(dmg 仅作首次安装介质)
    - target: zip
      arch: [arm64]
dmg:
  artifactName: Pion-${version}-${arch}.${ext}
# Linux(AppImage + deb):产物必须在 Linux 上构建——node-pty 的 .node 按 ABI/平台
# 重编,mac 本地跑 `--linux --dir` 只能做配置冒烟,产物不可用。不钉 arch:
# electron-builder 默认按当前机器架构出包(x64 机器出 x64,ARM 机器出 arm64),
# node-pty 与 Electron 天然同架构;release.yml 用双 runner 各出各的,更新通道文件
# 也按架构命名(x64 → latest-linux.yml,arm64 → latest-linux-arm64.yml,
# electron-updater 同规则读取),互不覆盖。
# 自更新仅 AppImage(依赖 APPIMAGE 环境变量);deb 等形态走 updater.ts 的
# unsupported → 下载链接降级。
linux:
  category: Development
  icon: assets/pion-logo.png
  # deb 必需字段;占位身份,接签名/GPG 流程时再定稿
  maintainer: Pion contributors <zucchiniEvader@users.noreply.github.com>
  artifactName: Pion-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
