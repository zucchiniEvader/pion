name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 类型检查 / i18n 对齐 / 纯函数回归都与平台无关，用最便宜的 runner。
    # 真实应用行为（Electron、daemon、e2e）不在 CI 里跑，见 CONTRIBUTING.md。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:i18n
      - run: npm run test:purity
