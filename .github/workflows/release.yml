name: release

# 推 tag（v0.1.0）触发：打 dmg（mac）+ AppImage/deb（Linux，x64 + arm64）→ 签名 + 公证（凭据来自 secrets）→ 发布 Release。
# 应用内「检查更新」读的就是 releases/latest 的 tag，所以 tag 必须是 v<package.json version>，
# 且发布后不能标成 prerelease，否则 GUI 永远认为已是最新。
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14 # arm64 runner，Intel runner 打不出 arm64 的 Electron
    permissions:
      contents: write # gh release create 需要
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # secrets 缺失时 electron-builder 跳过签名与公证并打日志，产物仍可用但会被 Gatekeeper 拦
      - run: npm run dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # GH_TOKEN 只给这一步：构建阶段不带它，electron-builder 就不会自作主张去 publish。
      # 附件要带全：electron-updater 在 mac 上先读 latest-mac.yml（版本 + 校验值）再下 zip
      # 更新，dmg 只是首次安装的介质。只传 dmg 的话应用内「检查更新」拿不到任何信息。
      - run: gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --generate-notes --title "Pion ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}

  # Linux 产物（AppImage + deb）：必须在 Linux 上构建——node-pty 的 .node 按平台/ABI
  # 重编，所以 x64/arm64 各在原生 runner 上出包（ubuntu-24.04-arm 是公共仓库免费的
  # arm64 runner）。更新通道文件按架构命名且两端同规则：electron-builder 给 x64 生成
  # latest-linux.yml、arm64 生成 latest-linux-arm64.yml，electron-updater 也按本机
  # 架构查同名文件（Provider.getChannelFilePrefix）——两个 runner 产物互不重名、
  # 各传各的，不存在互相 clobber，也不需要任何合并。
  # fail-fast: false：一个架构失败不让另一个被取消；已传上去的通道文件保证
  # 另一个架构的应用内更新照常工作。
  build-linux:
    needs: build # Release 由 build job 创建，排在其后避免 create 竞争
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest # x64
          - runner: ubuntu-24.04-arm # arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # gh release upload 需要
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      # latest-linux*.yml 同时覆盖 latest-linux.yml 与 latest-linux-arm64.yml——
      # 每个 runner 只生成自己架构的那份
      - run: gh release upload "$GITHUB_REF_NAME" release/*.AppImage release/*.AppImage.blockmap release/*.deb release/latest-linux*.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # Windows 产物（NSIS x64）：electron-rebuild 编 node-pty 需要 VS Build Tools，
  # windows runner 自带。未签名，SmartScreen 首启会拦（用户点"仍要运行"）。
  # electron-updater 在 Windows 读 latest.yml + exe + blockmap，缺一则自更新失败。
  # 上传步骤用 bash shell：PowerShell 不展开 release/*.exe 这种裸 glob。
  build-win:
    needs: build # Release 由 build job 创建，排在其后避免 create 竞争
    runs-on: windows-latest
    permissions:
      contents: write # gh release upload 需要
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - run: gh release upload "$GITHUB_REF_NAME" release/*.exe release/*.exe.blockmap release/latest.yml --clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash

  # 远程 runtime 的 daemon CLI 资产（install.sh/manifest.json/pion-daemon +
  # 两个 resources）——纯 JS esbuild 产物，无 native 编译，ubuntu runner 即可。
  # 应用内「远程安装」的一键命令指向 releases/latest/download，同一 tag 发布。
  daemon-assets:
    needs: build # Release 由 build job 创建，排在其后避免 create 竞争
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: package daemon-cli + upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/package-daemon.mjs --dl-base "https://github.com/${{ github.repository }}/releases/latest/download"
          gh release upload "$GITHUB_REF_NAME" \
            release/daemon-cli/install.sh \
            release/daemon-cli/uninstall.sh \
            release/daemon-cli/install.ps1 \
            release/daemon-cli/manifest.json \
            release/daemon-cli/pion-daemon \
            release/daemon-cli/resources/kanban-bridge.ts \
            release/daemon-cli/resources/pion-commands.ts \
            --clobber
